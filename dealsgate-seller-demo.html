<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0D1B4C">
<title>DealsGate — Seller Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0D1B4C;--navy2:#142a70;--green:#16A34A;--green2:#15803D;
  --gold:#F4B420;--gold2:#C98A00;--ink:#0F172A;--muted:#64748B;
  --line:#E2E8F0;--mist:#F4F6FB;--blue:#2563EB;--red:#DC2626;--purple:#7C3AED;
  --pink:#EC4899;--bg:#F8FAFC;--white:#fff;
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;outline:none}
a{color:inherit;text-decoration:none}

/* ============ APP SHELL ============ */
#app{min-height:100vh;display:flex;flex-direction:column}

/* Top bar */
.topbar{
  background:var(--navy);color:#fff;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
}
.topbar .brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;letter-spacing:-.3px}
.topbar .mark{width:28px;height:28px;border-radius:8px;background:var(--gold);color:var(--navy);
  display:grid;place-items:center;font-size:15px;font-weight:900;border:2px solid #fff;flex-shrink:0}
.topbar .mark .g{color:var(--green)}
.topbar .brand .g{color:var(--green)}
.topbar .meta{font-size:12px;color:rgba(255,255,255,.7);font-weight:700;font-family:Menlo,monospace}
.topbar .right{display:flex;align-items:center;gap:10px}
.topbar .right button{color:#fff;background:rgba(255,255,255,.12);
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;transition:background .15s}
.topbar .right button:hover{background:rgba(255,255,255,.2)}
.topbar .right .primary{background:var(--gold);color:var(--navy)}
.topbar .right .primary:hover{background:var(--gold2);color:#fff}

/* Layout for logged-in */
.app-layout{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 56px)}
@media(max-width:900px){
  .app-layout{grid-template-columns:1fr;padding-bottom:76px}
}

/* Sidebar */
.sidebar{
  background:#fff;border-right:1px solid var(--line);
  padding:20px 12px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
}
@media(max-width:900px){.sidebar{display:none}}
.sb-user{
  display:flex;align-items:center;gap:11px;padding:12px 12px 18px;
  border-bottom:1px solid var(--line);margin-bottom:14px;
}
.sb-user .avatar{
  width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);
  display:grid;place-items:center;font-size:14px;font-weight:800;flex-shrink:0;position:relative;
}
.sb-user .avatar .badge{
  position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;
  background:var(--green);color:#fff;display:grid;place-items:center;font-size:9px;border:2px solid #fff;
}
.sb-user .info .n{font-size:13.5px;font-weight:800;color:var(--navy)}
.sb-user .info .s{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.sb-link{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;
  font-size:13.5px;font-weight:600;color:#64748B;cursor:pointer;transition:all .12s;
}
.sb-link:hover{background:var(--mist);color:var(--navy)}
.sb-link.on{background:var(--mist);color:var(--navy);font-weight:800}
.sb-link .ic{width:20px;text-align:center;font-size:15px}
.sb-link .badge{margin-left:auto;background:var(--red);color:#fff;
  font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;min-width:20px;text-align:center}
.sb-sec{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#94A3B8;padding:16px 13px 6px}
.sb-cta{
  margin-top:auto;padding:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;border-radius:12px;text-align:center;
}
.sb-cta .t{font-size:13px;font-weight:800;margin-bottom:4px}
.sb-cta .d{font-size:11px;color:rgba(255,255,255,.75);margin-bottom:10px;line-height:1.45}
.sb-cta button{background:var(--gold);color:var(--navy);padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:800;width:100%}

/* Content */
.content{padding:32px 40px;overflow-x:hidden}
@media(max-width:900px){.content{padding:20px 16px}}
.pg-head{margin-bottom:24px}
.pg-head h1{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.6px;line-height:1.15}
.pg-head p{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.55}

/* Bottom nav (mobile) */
.bnav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px rgba(13,27,76,.08);
}
@media(max-width:900px){.bnav{display:flex;justify-content:space-around}}
.bnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;font-size:9.5px;font-weight:800;color:#94A3B8;
  letter-spacing:.02em;text-transform:uppercase;
}
.bnav button .ic{width:26px;height:26px;border-radius:8px;background:var(--mist);
  display:grid;place-items:center;font-size:14px}
.bnav button.on{color:var(--navy)}
.bnav button.on .ic{background:var(--gold);color:var(--navy)}

/* ============ LANDING ============ */
.landing{display:flex;flex-direction:column;flex:1}
.lp-hero{
  background:linear-gradient(155deg,#061133 0%,var(--navy) 55%,var(--navy2) 100%);
  color:#fff;padding:56px 40px 60px;position:relative;overflow:hidden;
}
@media(max-width:640px){.lp-hero{padding:36px 20px 44px}}
.lp-hero::after{
  content:"";position:absolute;right:-100px;top:-100px;width:320px;height:320px;
  border-radius:50%;background:radial-gradient(circle,rgba(244,180,32,.22),transparent 70%);
}
.lp-hero-inner{max-width:1120px;margin:0 auto;position:relative;z-index:1}
.lp-eyebrow{
  display:inline-flex;align-items:center;gap:8px;background:rgba(244,180,32,.14);
  border:1px solid rgba(244,180,32,.32);color:var(--gold);padding:7px 15px;
  border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:22px;
}
.lp-hero h1{
  font-size:clamp(30px,5.5vw,52px);font-weight:800;letter-spacing:-1.4px;
  line-height:1.05;max-width:760px;
}
.lp-hero h1 .g{color:var(--gold)}
.lp-hero h1 .gr{color:#4ADE80}
.lp-hero p{
  font-size:clamp(15px,1.8vw,18px);color:rgba(255,255,255,.78);
  max-width:600px;margin-top:20px;line-height:1.6;
}
.lp-cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.lp-cta button{
  padding:14px 26px;border-radius:11px;font-size:15px;font-weight:800;
  letter-spacing:.01em;transition:transform .12s;
}
.lp-cta button:active{transform:translateY(1px)}
.lp-cta .p{background:var(--gold);color:var(--navy);box-shadow:0 8px 24px rgba(244,180,32,.32)}
.lp-cta .s{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22)}
.lp-cta .s:hover{background:rgba(255,255,255,.14)}

.lp-body{max-width:1120px;margin:0 auto;padding:56px 40px 80px}
@media(max-width:640px){.lp-body{padding:40px 20px 60px}}
.lp-search{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:14px 20px;display:flex;align-items:center;gap:14px;
  box-shadow:0 4px 20px rgba(13,27,76,.08);margin-top:-38px;position:relative;z-index:2;
}
.lp-search input{flex:1;border:none;font-size:15px;font-family:inherit;color:var(--ink)}
.lp-search input::placeholder{color:#94A3B8}
.lp-search button{background:var(--navy);color:#fff;padding:10px 20px;border-radius:9px;
  font-size:13.5px;font-weight:700}

.lp-section{margin-top:56px}
.lp-section-title{
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--green2);margin-bottom:12px;
}
.lp-section h2{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.6px;line-height:1.15;margin-bottom:24px}
.lp-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.lp-step{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;
  border-top:4px solid var(--gold);
}
.lp-step .n{
  width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);
  display:grid;place-items:center;font-size:13px;font-weight:800;margin-bottom:12px;
  border:2px solid var(--gold);
}
.lp-step h3{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:8px;letter-spacing:-.2px}
.lp-step p{font-size:13.5px;color:#64748B;line-height:1.55}

/* ============ CARDS ============ */
.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:22px;box-shadow:0 1px 3px rgba(13,27,76,.05);
}
.card-sm{padding:16px}
.card-navy{background:linear-gradient(155deg,var(--navy),var(--navy2));color:#fff;border-color:var(--navy)}
.card-green{background:#F0FDF4;border-color:#BBF7D0}
.card-gold{background:#FEFBEB;border-color:#FCD34D}
.card-red{background:#FEF2F2;border-color:#FCA5A5}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;
  transition:all .15s;letter-spacing:.01em;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--navy);color:#fff}
.btn.p:hover{background:var(--navy2)}
.btn.g{background:var(--gold);color:var(--navy)}
.btn.g:hover{background:var(--gold2);color:#fff}
.btn.gr{background:var(--green);color:#fff}
.btn.rd{background:var(--red);color:#fff}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.o:hover{border-color:var(--navy)}
.btn.full{width:100%}
.btn.sm{padding:9px 14px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ TYPOGRAPHY ============ */
.kicker{
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold2);margin-bottom:8px;display:block;
}
.section-title{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.2px;margin-bottom:12px}
.muted{color:var(--muted);font-size:13.5px;line-height:1.6}

/* ============ PILLS ============ */
.pill{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  line-height:1.4;white-space:nowrap;
}
.pill.green{background:#DCFCE7;color:var(--green2)}
.pill.gold{background:#FEF3C7;color:var(--gold2)}
.pill.navy{background:var(--navy);color:#fff}
.pill.red{background:#FEE2E2;color:var(--red)}
.pill.blue{background:#DBEAFE;color:var(--blue)}
.pill.purple{background:#EDE9FE;color:var(--purple)}
.pill.mist{background:var(--mist);color:#64748B}

/* ============ ROWS ============ */
.row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;
}
.row:last-child{border-bottom:none}
.row .k{color:#64748B;font-weight:500;flex:1;min-width:0}
.row .v{color:var(--navy);font-weight:700;font-family:Menlo,monospace;
  font-size:13px;flex-shrink:0;text-align:right}
.row .v.g{color:var(--green)}
.row .v.r{color:var(--red)}
.row .v.gold{color:var(--gold2)}
.row.total{padding-top:14px;margin-top:6px;border-top:2px solid var(--navy);border-bottom:none}
.row.total .k{color:var(--navy);font-weight:800;font-size:14px}
.row.total .v{font-size:17px}

/* ============ FORMS ============ */
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px}
.fld input,.fld textarea,.fld select{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font-size:14px;font-weight:500;color:var(--ink);font-family:inherit;
  transition:border-color .15s;
}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(244,180,32,.15)}
.fld textarea{resize:vertical;min-height:80px;line-height:1.5}
.fld .hint{font-size:11px;color:var(--muted);margin-top:5px}

/* ============ CHECKBOXES ============ */
.cb{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.cb:last-child{border-bottom:none}
.cb .box{
  width:22px;height:22px;border:2px solid rgba(13,27,76,.25);border-radius:6px;
  flex-shrink:0;background:#fff;margin-top:1px;
  display:grid;place-items:center;font-size:13px;color:#fff;font-weight:900;
  transition:all .15s;
}
.cb.on .box{background:var(--green);border-color:var(--green)}
.cb .txt{font-size:14px;color:#334155;font-weight:500;flex:1;line-height:1.45}
.cb .txt b{color:var(--navy);font-weight:800}

/* ============ AVATAR ============ */
.av{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;
  flex-shrink:0;position:relative;
}
.av .v{
  position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;
  background:var(--green);color:#fff;display:grid;place-items:center;
  font-size:8px;border:2px solid #fff;
}

/* ============ ALERTS ============ */
.al{
  padding:14px 18px;border-radius:10px;font-size:13.5px;line-height:1.55;
  display:flex;gap:12px;align-items:flex-start;
}
.al .ic{font-size:18px;flex-shrink:0;line-height:1.1}
.al .b{flex:1;min-width:0}
.al .t{font-weight:800;margin-bottom:3px}
.al .d{line-height:1.55}
.al.gold{background:#FEFBEB;border-left:4px solid var(--gold);color:#78350F}
.al.green{background:#F0FDF4;border-left:4px solid var(--green);color:#065F46}
.al.red{background:#FEF2F2;border-left:4px solid var(--red);color:#7F1D1D}
.al.navy{background:var(--mist);border-left:4px solid var(--navy);color:#334155}

/* ============ GRID ============ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
@media(max-width:640px){.grid-2{margin-bottom:0}}

/* ============ STAT TILE ============ */
.stat{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;
  border-top:3px solid var(--gold);
}
.stat.green{border-top-color:var(--green)}
.stat.navy{border-top-color:var(--navy)}
.stat.red{border-top-color:var(--red)}
.stat .l{font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:#94A3B8;margin-bottom:8px}
.stat .v{font-family:Menlo,monospace;font-size:22px;font-weight:800;
  color:var(--navy);letter-spacing:-.4px;line-height:1}
.stat .v.g{color:var(--green)}
.stat .v.gold{color:var(--gold2)}
.stat .v.r{color:var(--red)}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}

/* ============ TIMELINE ============ */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;
  background:linear-gradient(180deg,var(--gold),var(--green),var(--navy));
  border-radius:2px;opacity:.35}
.tli{position:relative;padding:8px 0}
.tli::before{content:"";position:absolute;left:-22px;top:13px;width:12px;height:12px;
  border-radius:50%;background:#fff;border:2px solid var(--line);z-index:1}
.tli.done::before{background:var(--green);border-color:var(--green)}
.tli.now::before{background:var(--gold);border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(244,180,32,.22)}
.tli.pending::before{background:#fff;border-color:var(--line)}
.tli .t{font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tli.pending .t{color:#94A3B8;font-weight:600}
.tli .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}

/* ============ PROGRESS BAR ============ */
.prg{height:6px;background:var(--mist);border-radius:20px;overflow:hidden}
.prg .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));
  border-radius:20px;transition:width .3s}

/* ============ STEP INDICATOR ============ */
.steps{display:flex;gap:5px;margin-bottom:24px}
.steps .s{flex:1;height:5px;border-radius:20px;background:var(--mist);transition:background .2s}
.steps .s.done{background:var(--green)}
.steps .s.on{background:var(--gold)}

/* ============ MAP ============ */
.wmap{
  background:linear-gradient(135deg,#E0F2FE 0%,#BAE6FD 100%);
  border-radius:12px;position:relative;overflow:hidden;border:1px solid #7DD3FC;
  height:180px;
}
.wmap::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(13,27,76,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,27,76,.06) 1px,transparent 1px);
  background-size:22px 22px;
}
.wmap .pin{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:28px;height:28px;background:var(--red);border-radius:50% 50% 50% 0;
  rotate:-45deg;border:2.5px solid #fff;box-shadow:0 6px 16px rgba(220,38,38,.4);
}
.wmap .pin::after{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:8px;height:8px;background:#fff;border-radius:50%;
}
.wmap .lbl{
  position:absolute;bottom:10px;left:10px;background:#fff;padding:5px 10px;
  border-radius:6px;font-size:11px;font-weight:800;color:var(--navy);font-family:Menlo,monospace;
}

/* ============ MEDIA TILES ============ */
.mtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mtile{
  aspect-ratio:1;background:var(--mist);border-radius:10px;border:1px dashed var(--line);
  display:grid;place-items:center;font-size:22px;color:#CBD5E1;transition:all .2s;
}
.mtile.filled{background:linear-gradient(135deg,#E0E7FF,#C7D2FE);border:1px solid #C7D2FE;color:#4F46E5}
.mtile.video{grid-column:span 4;aspect-ratio:4/1;
  background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-color:#FCD34D;color:#D97706;
  font-size:14px;font-weight:800;color:#C98A00}

/* ============ OTP ============ */
.otp{display:flex;gap:8px;justify-content:center;margin:18px 0}
.otp input{
  width:44px;height:54px;text-align:center;font-size:22px;font-weight:800;
  font-family:Menlo,monospace;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;color:var(--navy);
}
.otp input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,180,32,.18)}

/* ============ CENTERED CARD ============ */
.centered{
  min-height:calc(100vh - 56px);display:grid;place-items:center;padding:40px 20px;
}
.centered .card{max-width:560px;width:100%}

/* ============ JOB CARD ============ */
.jobc{
  background:#FFF7E6;border-radius:12px;padding:16px 18px;
  border-left:4px solid var(--gold);display:flex;justify-content:space-between;
  gap:14px;align-items:center;margin-bottom:10px;
}
.jobc.purple{background:#F3E8FF;border-left-color:var(--purple)}
.jobc .l{flex:1;min-width:0}
.jobc .code{font-family:Menlo,monospace;font-size:11px;color:#8A93A6;font-weight:700}

/* ============ TOAST ============ */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,200%);
  background:var(--navy);color:#fff;padding:13px 22px;border-radius:12px;
  font-size:14px;font-weight:700;box-shadow:0 12px 32px rgba(13,27,76,.4);
  z-index:200;transition:transform .35s cubic-bezier(.4,.2,.2,1);
  display:flex;gap:10px;align-items:center;pointer-events:none;
  max-width:calc(100vw - 40px);
}
.toast.on{transform:translate(-50%,0)}
.toast.ok{background:var(--green)}
.toast.er{background:var(--red)}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;background:rgba(13,27,76,.6);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
}
.modal.on{display:flex}
.modal-inner{
  background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;
  max-height:92vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.4,.2,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-head{
  padding:18px 22px 14px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:#fff;z-index:2;
}

.modal-foot{

  border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}

/* ============ EMPTY ============ */
.empty{

}
.empty .em{font-size:36px;margin-bottom:12px;opacity:.4}

/* ============ HIDDEN ============ */
.hide{display:none !important}

    return Object.assign(freshState(), saved);
  } catch(e){ return freshState(); }
}
function saveState(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}

  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';

/* ============================================================
   NETLIFY FORMS — sends a submission to Netlify
   Each formName matches a hidden <form> declared above.
   ============================================================ */
let dgBusy = false;
async function dgSend(formName, data){
  if(dgBusy) return false;
  dgBusy = true;
  try {
    const body = new URLSearchParams();
    body.append('form-name', formName);
    body.append('submitted_at', new Date().toISOString());
    body.append('page', location.pathname);
    Object.keys(data).forEach(k => body.append(k, data[k] == null ? '' : String(data[k])));
    const res = await fetch(location.pathname, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  } catch(err){
    console.error('Netlify form failed:', formName, err);
    toast('Could not submit. Check your connection and try again.', 'er');
    return false;
  } finally {
    dgBusy = false;
  }
}

function toast(msg, tone){
  const el = document.getElementById('toast');
  el.className = 'toast on ' + (tone || '');
  document.getElementById('toastMsg').textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast ' + (tone || ''), 2400);
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modal').classList.add('on');

function closeModal(){

  return `

      <p style="font-weight:800;color:var(--navy);font-size:15px;margin-bottom:20px">${S.signup.email}</p>

      <div class="otp" id="otpInputs">
        ${[0,1,2,3,4,5].map(i => `<input maxlength="1" inputmode="numeric" data-i="${i}" oninput="otpIn(this)" onkeydown="otpKey(event,${i})">`).join('')}
      </div>

      <p style="font-size:12.5px;color:var(--muted);margin-bottom:20px">Resend code in <b style="color:var(--navy)">0:42</b></p>

        <span class="ic">💡</span>

      </div>

      <button class="btn p full" onclick="verifyOTP()">Verify →</button>
    </div>
  `;
}

function otpIn(el){
  el.value = el.value.replace(/\D/g,'').slice(0,1);
  const i = Number(el.dataset.i);
  if(el.value && i < 5){
    const next = document.querySelector(`#otpInputs input[data-i="${i+1}"]`);
    if(next) next.focus();
  }
}
function otpKey(e, i){
  if(e.key === 'Backspace' && !e.target.value && i > 0){
    const prev = document.querySelector(`#otpInputs input[data-i="${i-1}"]`);
    if(prev) prev.focus();
  }
}
function verifyOTP(){
  const code = Array.from(document.querySelectorAll('#otpInputs input')).map(i => i.value).join('');
  if(code.length !== 6){ toast('Enter all 6 digits', 'er'); return; }
  go('verify');
}

async function completeVerification(){
  const sg = S.signup;
  const okV = await dgSend('identity-verification-request', {
    full_name: sg.fullName, email: sg.email, phone: sg.phone,
    verify_method: (sg.verifyMethod || '').toUpperCase()
  });
  if(!okV) return;
  S.signup.verificationStatus = 'pending';
  saveState();
  render();
  setTimeout(() => {
    S.signup.verificationStatus = 'verified';
    // Copy details over to user
    if(S.signup.fullName) S.user.name = S.signup.fullName;
    if(S.signup.email) S.user.email = S.signup.email;
    if(S.signup.phone) S.user.phone = S.signup.phone;
    if(S.signup.city) S.user.city = S.signup.city;
    saveState();
    toast('Identity verified · welcome to DealsGate', 'ok');
    go('dashboard');
  }, 1200);
}

  return `

function startCreateDeal(){
  S.currentDeal = {
    step: 1,
    item: '', description: '',
    sector: 'Phones & Tablets', industry: '', productLine: '',
    condition: 'Used', quantity: 1,
    qualityNotes: '', price: 0,
    photos: [], video: null,
    address: '', lat: null, lng: null, lga: '',
    guaranteePaid: false,
    code: null,
  };
  saveState();
  go('deals/create');
}

function renderCreateDeal(){
  const d = S.currentDeal;
  if(!d) { startCreateDeal(); return ''; }
  const step = d.step;

  return `
    <div class="pg-head">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px">
        <button class="btn o sm" onclick="exitCreateDeal()">← Cancel</button>
        <span style="font-family:Menlo,monospace;font-size:12px;color:var(--muted);font-weight:700">Step ${step} of 7</span>
      </div>
      <div class="steps">
        ${[1,2,3,4,5,6,7].map(i => `<div class="s ${i < step ? 'done' : i === step ? 'on' : ''}"></div>`).join('')}
      </div>
    </div>

    ${step === 1 ? renderWizStep1() : ''}
    ${step === 2 ? renderWizStep2() : ''}
    ${step === 3 ? renderWizStep3() : ''}
    ${step === 4 ? renderWizStep4() : ''}
    ${step === 5 ? renderWizStep5() : ''}
    ${step === 6 ? renderWizStep6() : ''}
    ${step === 7 ? renderWizStep7() : ''}
  `;
}

function exitCreateDeal(){
  if(!confirm('Cancel creating this deal? Your progress will be lost.')) return;
  S.currentDeal = null;
  saveState();
  go('dashboard');
}
function wizNext(){ S.currentDeal.step = Math.min(7, S.currentDeal.step + 1); saveState(); render(); window.scrollTo(0,0); }
function wizBack(){ S.currentDeal.step = Math.max(1, S.currentDeal.step - 1); saveState(); render(); window.scrollTo(0,0); }

  if(S.wallet < amt){ toast('Not enough in main wallet', 'er'); return; }
  S.wallet -= amt;
  S.guarantee += amt;
  S.transactions.unshift({ type:'cr', code:'GUARANTEE_TOPUP', desc:'Top up from main wallet', amt: amt, at: Date.now() });
  saveState();
  toast('₦' + amt.toLocaleString() + ' moved to guarantee wallet', 'ok');
  render();
}

function payGuarantee(){
  if(S.guarantee < 5000){ toast('Insufficient guarantee balance', 'er'); return; }
  S.guarantee -= 5000;
  S.currentDeal.guaranteePaid = true;
  saveState();

}

async function publishDeal(){
  const d = S.currentDeal;
  const code = 'DG-' + Math.floor(Math.random() * 900000 + 100000);
  const u = S.user;
  const okD = await dgSend('protected-deal', {
    deal_code: code, seller_name: u.name, seller_email: u.email, seller_phone: u.phone,
    item: d.item, description: d.description, sector: d.sector, condition: d.condition,
    quantity: d.quantity, quality_notes: d.qualityNotes, price_ngn: d.price,
    address: d.address, lga: d.lga, latitude: d.lat, longitude: d.lng,
    photo_count: (d.photos || []).length, video_attached: d.video ? 'yes' : 'no',
    guarantee_paid: d.guaranteePaid ? 'yes' : 'no'
  });
  if(!okD) return;
  const deal = {
    code,
    item: d.item,
    price: d.price,
    status: 'AWAITING_BUYER_PAYMENT',
    lga: d.lga,
    buyer: '—',
    createdAt: Date.now(),
    timeline: ['AWAITING_BUYER_PAYMENT'],
  };
  S.deals.unshift(deal);
  S.transactions.unshift({ type:'db', code:'GUARANTEE_HOLD', desc:'Guarantee hold · ' + code, amt: -5000, at: Date.now() });
  d.code = code;
  saveState();
  go('deals/published');
}

async function doWithdraw(amt, method){
  const code = Array.from(document.querySelectorAll('#modalBox .otp input')).map(i => i.value).join('');
  if(code.length !== 6){ toast('Enter 6 digits', 'er'); return; }
  const fee = amt <= 5000 ? 10 : amt <= 50000 ? 25 : 50;
  const net = amt - fee;
  const uw = S.user;
  const okW = await dgSend('withdrawal-request', {
    seller_name: uw.name, seller_email: uw.email, seller_phone: uw.phone,
    amount_ngn: amt, fee_ngn: fee, net_ngn: net,
    verification_method: method || '', destination: 'GTBank ···· 6789'
  });
  if(!okW) return;
  S.wallet -= amt;
  S.transactions.unshift({ type:'db', code:'WITHDRAWAL', desc:'Withdrawal to GTBank · ···· 6789', amt: -amt, at: Date.now() });
  saveState();
  closeModal();
  toast('₦' + net.toLocaleString() + ' sent to bank', 'ok');
  render();
}

async function submitRequest(){
  const title = document.getElementById('rTitle').value.trim();
  const lga = document.getElementById('rLga').value;
  const price = Number(document.getElementById('rPrice').value);
  if(!title || title.length < 3){ toast('Give it a title', 'er'); return; }
  if(price < 6000){ toast('Minimum ₦6,000', 'er'); return; }
  if(S.wallet < price){ toast('Not enough in wallet', 'er'); return; }

  const code = 'OD-' + Math.floor(Math.random() * 900000 + 100000);
  const ur = S.user;
  const okR = await dgSend('vet-agent-request', {
    request_code: code, title, lga, price_ngn: price,
    requester_name: ur.name, requester_email: ur.email, requester_phone: ur.phone
  });
  if(!okR) return;
  S.wallet -= price;
  S.requests.unshift({ code, title, lga, price, status: 'OPEN', createdAt: Date.now() });
  S.transactions.unshift({ type:'db', code:'REQUEST_PAYMENT', desc:'Vet Agent request · ' + code, amt: -price, at: Date.now() });
  saveState();
  toast('Request published · ' + code, 'ok');
  setTimeout(() => {
    const r = S.requests.find(x => x.code === code);
    if(r){ r.status = 'ACCEPTED'; r.agent = 'Blessing Eze'; saveState(); }
  }, 1500);
  go('requests');
}

function copyRef(url){

}
function shareRefWA(url){
  const text = encodeURIComponent('Join me on DealsGate — safe online trade for Nigerians. Sign up with my link:\n\nhttps://' + url);
  window.open('https://wa.me/?text=' + text, '_blank');
}

async function submitAgentApplication(){
  const ua = S.user;
  const gv = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const okA = await dgSend('agent-application-seller-portal', {
    applicant_name: ua.name, applicant_email: ua.email, applicant_phone: ua.phone, city: ua.city,
    sector_primary: gv('aSector1'), sector_second: gv('aSector2'),
    service_lga: gv('aLga'), max_travel: gv('aTravel')
  });
  if(!okA) return;
  S.agent.applied = true;
  saveState();
  toast('Application submitted', 'ok');
  setTimeout(() => go('agent/training'), 300);
}

    </div>

      ${modules.map((m, i) => {

function openBuyCheckout(code){
  const m = S.marketplace.find(x => x.code === code);
  if(!m) return;
  const buyerFee = Math.round(m.price * 0.02);
  const vet = 6000;
  const log = 3500;
  const total = m.price + buyerFee + vet + log;

  openModal(`
    <div class="modal-head"><h3>Checkout · ${m.item}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="card card-sm" style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#94A3B8;margin-bottom:4px">Seller</div>
        <div style="font-weight:800;color:var(--navy);font-size:14px">${m.seller}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${m.lga} · ★ ${m.rating}</div>
      </div>

      <div class="row"><span class="k">Item price</span><span class="v">${fmt(m.price)}</span></div>
      <div class="row"><span class="k">Buyer service fee (2%)</span><span class="v">${fmt(buyerFee)}</span></div>
      <div class="row"><span class="k">Vet Agent fee</span><span class="v">${fmt(vet)}</span></div>
      <div class="row"><span class="k">Logistics</span><span class="v">${fmt(log)}</span></div>
      <div class="row total"><span class="k">Your total</span><span class="v">${fmt(total)}</span></div>

      <div class="al green" style="margin-top:14px">
        <span class="ic">🛡</span>
        <div class="b"><div class="d">Same protection as when you sell. Escrow holds the money. Vet Agent inspects the item. You approve before the seller ships.</div></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn o" onclick="closeModal()">Cancel</button>
      <button class="btn g" onclick="confirmBuy('${m.code}', ${total})">Pay ${fmt(total)} →</button>
    </div>
  `);
}

async function confirmBuy(code, total){
  if(S.wallet < total){ toast('Not enough wallet balance', 'er'); return; }
  const mb = S.marketplace.find(x => x.code === code) || {};
  const ub = S.user;
  const okB = await dgSend('buy-order', {
    item_code: code, item: mb.item, seller: mb.seller, lga: mb.lga,
    item_price_ngn: mb.price, total_ngn: total,
    buyer_name: ub.name, buyer_email: ub.email, buyer_phone: ub.phone
  });
  if(!okB) return;
  S.wallet -= total;
  S.transactions.unshift({ type:'db', code:'BUY_ESCROW', desc:'Purchase into escrow · ' + code, amt: -total, at: Date.now() });
  saveState();
  closeModal();
  toast('Payment secured in escrow · awaiting inspection', 'ok');
  render();
}
